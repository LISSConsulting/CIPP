name: Build CIPP Production Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lissconsulting/cipp

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    name: Build and Publish Production Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Node.js version
        id: node-version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g, '')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: npm run build

      - name: Stamp deployed version
        shell: bash
        run: |
          version=$(jq -r '.version' public/version.json)
          jq -n \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg tag "liss" \
            --arg buildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, tag: $tag, buildDate: $buildDate}' \
            > out/version.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read build metadata
        id: build-metadata
        shell: bash
        run: |
          echo "version=$(jq -r '.version' public/version.json)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          build-args: |
            CIPP_BASE_IMAGE=ghcr.io/cyberdrain/cipp:${{ steps.build-metadata.outputs.version }}
            CIPP_VERSION=${{ steps.build-metadata.outputs.version }}
            CIPP_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.build-metadata.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
